name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VAELO_KEYSTORE_B64: ${{ secrets.VAELO_KEYSTORE_B64 }}
      VAELO_KEYSTORE_PASSWORD: ${{ secrets.VAELO_KEYSTORE_PASSWORD }}
      VAELO_KEYSTORE_PATH: ${{ github.workspace }}/keystore/vaelo-release.jks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing key
        if: env.VAELO_KEYSTORE_B64 != ''
        run: |
          mkdir -p keystore
          echo "$VAELO_KEYSTORE_B64" | tr -d ' \n' | base64 -d > "$VAELO_KEYSTORE_PATH"
      - name: Warn when unsigned
        if: env.VAELO_KEYSTORE_B64 == ''
        run: echo "::warning::VAELO_KEYSTORE_B64 secret missing - APK will be signed with a temporary debug key"
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Vaelo-apk
          path: app/build/outputs/apk/release/app-release.apk
